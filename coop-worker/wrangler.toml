# The co-op relay on Cloudflare Workers (docs/coop/HOSTING.md, "A free website").
name = "pokerogue-coop-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# The matchmaking queue (D37)
[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

# The players-online count of the title screen (D46): how many players are connected, nothing else
[[durable_objects.bindings]]
name = "ONLINE"
class_name = "Online"

# The room counter (D43): rooms opened and filled, by size, nothing else. Remove it and the relay counts nothing
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "pokerogue_coop_rooms"

# The free plan has Durable Objects with SQLite storage only
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Online"]

[vars]
# The address of the game's pages, as the browser sends it in `Origin` (no path, no trailing slash).
# Several: a comma list. "*": any page may use this relay.
ALLOWED_ORIGINS = "https://spider12223.github.io"
HOLD_MS = "60000"
IDLE_ROOM_MS = "1800000"
